version: '3.8'

services:
  cmdb:
    image: registry.cn-shanghai.aliyuncs.com/dannamax/cmdb-platform:latest
    container_name: cmdb-platform
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      - cmdb-data:/app/data
      - cmdb-uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - cmdb-network

networks:
  cmdb-network:
    driver: bridge

volumes:
  cmdb-data:
    driver: local
  cmdb-uploads:
    driver: local
