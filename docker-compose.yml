version: '2'

services:
  cmdb:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cmdb-platform
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      - cmdb-data:/app/data
      - cmdb-uploads:/app/uploads
    networks:
      - cmdb-network

networks:
  cmdb-network:
    driver: bridge

volumes:
  cmdb-data:
    driver: local
  cmdb-uploads:
    driver: local
