# Nginx 配置文件
# 用于 CMDB 平台生产环境部署
# 
# 使用方法:
#   1. 复制到 /etc/nginx/conf.d/cmdb.conf
#   2. 修改 server_name 为实际域名
#   3. nginx -t && systemctl reload nginx

upstream cmdb_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name cmdb.example.com;  # 修改为实际域名
    
    # 强制跳转 HTTPS (生产环境取消注释)
    # return 301 https://$server_name$request_uri;
    
    # 访问日志
    access_log /var/log/nginx/cmdb_access.log;
    error_log /var/log/nginx/cmdb_error.log;
    
    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;
    
    # API 代理
    location /api/ {
        proxy_pass http://cmdb_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        
        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # 上传大小限制
        client_max_body_size 100m;
    }
    
    # 静态文件
    location / {
        proxy_pass http://cmdb_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        
        # 静态资源缓存
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            proxy_pass http://cmdb_backend;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
    }
}

